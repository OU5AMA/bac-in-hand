# ================================================
# ================================================
# COMMON CONFIGURATION (Applied to ALL profiles)
# ================================================


spring:
  application:
    name: bac-in-hand
  profiles:
    active: dev

server:
  port: 8080

---

# ============================================================
# DEVELOPMENT PROFILE (dev) - Uses H2 Database
# ============================================================
spring:
  config:
    activate:
      on-profile: dev
  # ========== DATASOURCE CONFIGURATION (H2) =================
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  # ========== JAP CONFIGURATION ============================
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    # ========= H2 CONSOLE CONFIGURATION ==================
    h2:
      console:
        enabled: true
      path: /h2-console
    # ========== LOGGING CONFIGURATION ====================
    logging:
      level:
        org:
          springframework: DEBUG
          hibernate: DEBUG
          hibernate.SQL: DEBUG
          hibernate.type.descriptor.sql.BasicBinder: TRACE

  ___

  # ============================================================
  # PRODUCTION PROFILE (prod) - Uses PostreSQL
  # ============================================================
  spring:
    config:
      activate:
        on-profile: prod
    # ========== DATASOURCE CONFIGURATION (PostgreSQL) ===========
    datasource:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/yourdb}
      username: ${DB_USERNAME:postgres}
      password: ${DB_PASSWORD:postgres}
      driver-class-name: org.postgresql.Driver
    # ========== JPA CONFIGURATION ==============================
    jpa:
      hibernate:
        ddl-auto: update
        show-sql: false
        properties:
          hibernate:
            dialect: org.hibernate.dialect.PostgresSQLDialect
            # === CONNECTION POOL OPTIMIZATION =================
            hibernate:
              c3p0:
                min-size: 5
                max_size: 20
                timeout: 300
                max_statement: 50

# ============= LOGGING CONFIGURATION ==========================
logging:
  level:
    org:
      springframework: INFO
      hibernate: INFO


